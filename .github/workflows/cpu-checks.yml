name: CPU checks (not GPU inference)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.smoke_ui
      - run: python -m compileall -q app.py tryon scripts
      - run: bash -n scripts/setup.sh scripts/start.sh
